<title>Sajad Pharmacy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: phone-first. Top bar, one page at a time, bottom tabs (Balance, Invoice, Cr/Dr, Stock, Accounts). */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --fg:#14211e; --muted:#5b6b67; --line:#d9e2df;
  --accent:#0f6b5c; --accent-fg:#ffffff; --accent-soft:#e1f0ec;
  --good:#1d7a3e; --warn:#a15c00; --warn-soft:#fff1dc; --bad:#b42318; --bad-soft:#fde7e5;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#17221f; --fg:#e4eeeb; --muted:#97aaa5; --line:#2a3a36;
  --accent:#4fbfa8; --accent-fg:#06221c; --accent-soft:#18332d;
  --good:#5fcf86; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#17221f; --fg:#e4eeeb; --muted:#97aaa5; --line:#2a3a36;
  --accent:#4fbfa8; --accent-fg:#06221c; --accent-soft:#18332d;
  --good:#5fcf86; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-fg)}
header .wrap{padding-block:12px;display:flex;align-items:center;gap:10px}
header h1{font:700 18px var(--font-head);margin:0;flex:1;min-width:0}
header small{display:block;font:400 12px var(--font-body);opacity:.9}
header .back{background:none;border:0;color:inherit;font-size:24px;cursor:pointer;padding:0 6px 0 0;display:none}
main{padding-block:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.big{font:700 24px var(--font-head);font-variant-numeric:tabular-nums}
.red{color:var(--bad)}.green{color:var(--good)}.muted{color:var(--muted)}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:10px;cursor:pointer;display:block;width:100%;border:0;text-align:left;font:600 14px var(--font-body)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--fg);text-align:left;font:15px var(--font-body)}
.li:last-child{border-bottom:0}
.li>span{min-width:0}
.li small{display:block;color:var(--muted);font-size:12.5px}
.li b{font-variant-numeric:tabular-nums;white-space:nowrap}
.no{display:inline-block;min-width:38px;color:var(--muted);font-weight:600}
.nolink{cursor:default}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.btn{display:block;width:100%;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);padding:12px;border-radius:10px;font:700 15px var(--font-body);cursor:pointer;text-align:center}
.btn.o{background:var(--surface);color:var(--accent)}
.btn.danger{background:var(--surface);border-color:var(--line);color:var(--bad)}
.btns{display:grid;gap:8px;margin:12px 0}
.btns.two{grid-template-columns:1fr 1fr}
input,select{font:16px var(--font-body);padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.form{display:grid;gap:10px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lineBox{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--surface)}
.pick{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px}
.pick .li{padding:9px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--accent);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{background:var(--surface);color:var(--accent);border:0;padding:10px;font:700 14px var(--font-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabs button{flex:1;background:none;border:0;border-top:3px solid transparent;padding:11px 0;color:var(--muted);font:600 12px var(--font-body);cursor:pointer;min-width:0}
.tabs button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:18px;width:min(560px,calc(100vw - 24px));max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
h2{font:700 17px var(--font-head);margin:0 0 4px}
h3{font:700 13px var(--font-head);margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:30;max-width:90vw}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:18px}
.tot{display:flex;justify-content:space-between;font-weight:700;padding-top:4px;font-variant-numeric:tabular-nums}
.sum{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:grid;gap:4px}
.sum div{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
.sum .net{font:700 20px var(--font-head);border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
textarea{width:100%;height:120px;font:12px ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header><div class="wrap">
  <button class="back" id="back" aria-label="Back">‹</button>
  <h1 id="title">Sajad Pharmacy</h1>
</div></header>
<main class="wrap" id="app"></main>
<nav class="tabs" id="tabs">
  <button data-v="home">Balance</button><button data-v="invoice">Invoice</button><button data-v="crdr">Cr / Dr</button><button data-v="stock">Stock</button><button data-v="accts">Accounts</button>
</nav>
<dialog id="dlg"></dialog>

<script>
// ---------- data ----------
const KEY='ledger.v2';
const EMPTY=()=>({parties:[],customers:[],lots:[],tx:[]});
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return null}
// CLOUD = shared database (Firebase) when firebase-config.js has the project settings; otherwise this phone only.
const CLOUD=!!(window.FIREBASE_CONFIG&&window.firebase);
const COLS=['parties','customers','lots','tx'];
let db=CLOUD?EMPTY():(load()||EMPTY());
let fbAuth=null,fbStore=null,user=null,ready=0,synced={parties:{},customers:{},lots:{},tx:{}},unsubs=[],migChecked=false;
let _s=0;const nextSeq=()=>Date.now()*1000+(_s++%1000);
// same object, same text, whatever the key order
const sig=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,k)=>(a[k]=v[k],a),{}):v);
function save(){
  if(!CLOUD){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Could not save: browser storage is blocked')}return}
  pushDiff();
}
// send only what changed to the shared database. A stock quantity change is sent as +/- so two phones selling at once add up.
function pushDiff(){
  const ops=[];
  COLS.forEach(c=>{
    const cur={};db[c].forEach(x=>cur[x.id]=x);
    for(const id in cur){
      const j=sig(cur[id]),old=synced[c][id];
      if(old===j)continue;
      if(old!==undefined&&c==='lots'){
        const o=JSON.parse(old),a={...o},b={...cur[id]};delete a.qty;delete b.qty;
        if(sig(a)===sig(b)){ops.push({c,id,inc:cur[id].qty-o.qty});synced[c][id]=j;continue}
      }
      ops.push({c,id,set:JSON.parse(JSON.stringify(cur[id]))});synced[c][id]=j;
    }
    for(const id in synced[c])if(!(id in cur)){ops.push({c,id,del:true});delete synced[c][id]}
  });
  for(let i=0;i<ops.length;i+=400){
    const batch=fbStore.batch();
    ops.slice(i,i+400).forEach(o=>{
      const ref=fbStore.collection(o.c).doc(o.id);
      if(o.del)batch.delete(ref);
      else if(o.inc!==undefined)batch.set(ref,{qty:firebase.firestore.FieldValue.increment(o.inc)},{merge:true});
      else batch.set(ref,o.set);
    });
    batch.commit().catch(e=>toast('Could not save to the shared database: '+(e.code||e.message)));
  }
}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=s=>encodeURIComponent(s).replace(/'/g,'%27');
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const R=n=>(n<0?'-':'')+'Rs '+Math.round(Math.abs(n)).toLocaleString('en-PK');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=d=>{const [y,m,dd]=d.split('-');return dd+'/'+m+'/'+y};
const fexp=e=>e?e.slice(5)+'/'+e.slice(0,4):'—';
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

// ---------- accounts and balances ----------
// Account number 0 = no account: cash purchase (who 'cash') and counter sale (who 'cash'). No balance is kept for it.
const BILL={party:'purchase',cust:'sale'},SETTLE={party:'paid',cust:'received'},PAY={party:'pay',cust:'recv'};
const list=kind=>kind==='party'?db.parties:db.customers;
const person=(kind,id)=>list(kind).find(x=>x.id===id);
const sortedList=kind=>list(kind).slice().sort((a,b)=>a.no-b.no);
function stats(kind,id){
  const p=person(kind,id);let billed=0,settled=0;
  db.tx.forEach(t=>{if(t.who!==id)return;if(t.type===BILL[kind]){billed+=t.amount;settled+=t[SETTLE[kind]]||0}else if(t.type===PAY[kind])settled+=t.amount});
  const prev=p?num(p.prev):0;return{prev,billed,settled,bal:prev+billed-settled};
}
const kindOfType=t=>t==='purchase'||t==='pay'?'party':'cust';
function whoLabel(t){
  if(t.type==='stock')return 'Opening / added stock';
  if(t.who==='cash')return t.type==='purchase'?'0 · Cash purchase':'0 · Counter sale';
  const k=kindOfType(t.type),p=person(k,t.who);return p?p.no+' · '+p.name:'(deleted)';
}
function nextNo(type,who){let m=0;db.tx.forEach(t=>{if(t.type===type&&t.who===who&&t.no>m)m=t.no});return m+1}
function nextAcctNo(kind){let m=0;list(kind).forEach(p=>{if(p.no>m)m=p.no});return m+1}
function expiryInfo(e){
  if(!e)return null;const [y,m]=e.split('-').map(Number);const end=new Date(y,m,0,23,59,59);
  const days=Math.floor((end-new Date())/864e5);
  if(days<0)return{k:'bad',txt:'Expired',days};
  if(days<=183)return{k:'warn',txt:Math.max(1,Math.round(days/30))+' mo left',days};
  return null;
}
function stockItems(){
  const map={};
  db.lots.filter(l=>l.qty>0).forEach(l=>{const k=l.item.trim().toLowerCase();(map[k]=map[k]||{name:l.item,qty:0,value:0,lots:[]});const it=map[k];it.qty+=l.qty;it.value+=l.qty*l.rate;it.lots.push(l)});
  return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name));
}
const stockTotal=()=>db.lots.reduce((a,l)=>a+l.qty*l.rate,0);
const expiring=()=>db.lots.filter(l=>l.qty>0&&expiryInfo(l.expiry)).sort((a,b)=>a.expiry.localeCompare(b.expiry));
const lotSource=l=>l.party==='cash'?'cash purchase':l.party?(person('party',l.party)?.name||'?'):'added stock';

// ---------- navigation ----------
let view={n:'home'},crTab='cust',invFilter='all',invTerm='';
function go(n,id,extra){view={n,id,...extra};try{window.scrollTo(0,0)}catch(e){}render()}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});
$('#back').addEventListener('click',()=>go(view.back||'accts'));
function chrome(title,sub,back,tab){
  $('#title').innerHTML=esc(title)+((sub||(CLOUD&&!navigator.onLine))?`<small>${sub||''}${CLOUD&&!navigator.onLine?(sub?' · ':'')+'offline, will sync when online':''}</small>`:'');
  $('#back').style.display=back?'block':'none';
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===tab));
}
function render(){
  if(CLOUD&&!user)return showLogin();
  if(CLOUD&&ready<COLS.length){chrome('Sajad Pharmacy','Loading…',false,'');$('#app').innerHTML='<div class="empty">Loading the shared data…</div>';return}
  $('#tabs').hidden=false;
  ({home:rHome,invoice:rInvoice,crdr:rCrDr,stock:rStock,accts:rAccts,acct:rAcct}[view.n]||rHome)()
}
function openDlg(html){const d=$('#dlg');d.innerHTML=html;if(!d.open)d.showModal();return d}
function closeDlg(){$('#dlg').close()}

// ---------- balance sheet ----------
function rHome(){
  const cust=sortedList('cust').map(c=>({c,bal:stats('cust',c.id).bal})).filter(x=>x.bal!==0);
  const part=sortedList('party').map(p=>({p,bal:stats('party',p.id).bal})).filter(x=>x.bal!==0);
  const stk=stockTotal();
  const assets=cust.reduce((a,x)=>a+x.bal,0)+stk,liab=part.reduce((a,x)=>a+x.bal,0),net=assets-liab;
  const exp=expiring(),expired=exp.filter(l=>expiryInfo(l.expiry).k==='bad').length;
  chrome('Sajad Pharmacy','Balance sheet',false,'home');
  const empty=!db.parties.length&&!db.customers.length&&!db.lots.length;
  $('#app').innerHTML=`
  ${exp.length?`<button class="alert ${expired?'bad':''}" onclick="go('stock')">⚠ ${exp.length} stock item${exp.length>1?'s':''} ${expired?'expired or ':''}expiring within 6 months. Tap to see.</button>`:''}
  <div class="sum"><div><span>Assets</span><span>${R(assets)}</span></div><div><span>Liabilities</span><span>${R(liab)}</span></div><div class="net"><span>Net amount</span><span class="${net<0?'red':''}">${R(net)}</span></div></div>
  ${empty?`<div class="card empty">Nothing added yet.<br>1. <b>Accounts</b>: add your parties and customers (with previous balance).<br>2. <b>Stock</b>: add the stock you already have.<br>3. <b>Invoice</b>: make purchase and sale bills.</div>`:''}
  <h3>Assets (to receive + stock)</h3><div class="card" style="padding:2px 14px">
    ${cust.map(x=>`<button class="li" onclick="go('acct','${x.c.id}',{kind:'cust',back:'home'})"><span><span class="no">${x.c.no}</span>${esc(x.c.name)} <span class="muted">(To Rec)</span></span><b class="${x.bal<0?'red':''}">${R(x.bal)}</b></button>`).join('')}
    <button class="li" onclick="go('stock')"><span><span class="no">STK</span>Total Stock Amount</span><b>${R(stk)}</b></button></div>
  <h3>Liabilities (to pay)</h3><div class="card" style="padding:2px 14px">
    ${part.length?part.map(x=>`<button class="li" onclick="go('acct','${x.p.id}',{kind:'party',back:'home'})"><span><span class="no">${x.p.no}</span>${esc(x.p.name)} <span class="muted">(To Pay)</span></span><b class="${x.bal<0?'green':''}">${R(x.bal)}</b></button>`).join(''):'<div class="empty">Nothing to pay.</div>'}</div>
  <h3>Backup</h3><div class="card">
    <p class="muted" style="margin:0 0 8px;font-size:13px">Your data is only on this phone. Copy a backup now and then and keep it safe (WhatsApp it to yourself).</p>
    <div class="btns two" style="margin:0"><button class="btn o" id="bCopy">Copy backup</button><button class="btn o" id="bRest">Restore backup</button></div>
    <div id="bBox" hidden><textarea id="bTxt" style="margin-top:10px"></textarea><div class="btns"><button class="btn" id="bGo" hidden>Replace all data with this backup</button></div></div>
    ${CLOUD?`<div class="btns" style="margin-bottom:0"><div class="muted" style="font-size:13px">Logged in as ${esc(user&&user.email)}. Data is shared with everyone who has a login.</div><button class="btn o" id="logout">Log out</button></div>`:'<div class="btns" style="margin-bottom:0"><button class="btn danger" id="wipe">Delete all data</button></div>'}</div>`;
  $('#bCopy').onclick=()=>{const s=JSON.stringify(db);$('#bBox').hidden=false;$('#bGo').hidden=true;$('#bTxt').value=s;
    navigator.clipboard?.writeText(s).then(()=>toast('Backup copied')).catch(()=>{$('#bTxt').select();toast('Select all and copy the text')})};
  $('#bRest').onclick=()=>{$('#bBox').hidden=false;$('#bGo').hidden=false;$('#bTxt').value='';$('#bTxt').placeholder='Paste backup text here';$('#bTxt').focus()};
  $('#bGo').onclick=e=>{try{const d=JSON.parse($('#bTxt').value);if(!d.parties||!d.tx||!d.lots)throw 0;
    if(CLOUD&&!e.target.dataset.c){e.target.dataset.c=1;e.target.textContent='This replaces the data for EVERYONE. Tap again to confirm';return}
    db={parties:d.parties,customers:d.customers||[],lots:d.lots,tx:d.tx};save();render();toast('Backup restored')}catch(x){toast('That text is not a valid backup')}};
  const w=$('#wipe');if(w)w.onclick=e=>{const b=e.target;if(b.dataset.c){db=EMPTY();save();render();toast('All data deleted')}else{b.dataset.c=1;b.textContent='Tap again to delete everything'}};
  const lo=$('#logout');if(lo)lo.onclick=()=>fbAuth.signOut();
}

// ---------- accounts (Cust) ----------
let acctTab='cust',stockTerm='';
function rAccts(){
  chrome('Accounts','Parties and customers',false,'accts');
  const k=acctTab;
  $('#app').innerHTML=`<div class="seg"><button aria-pressed="${k==='cust'}" onclick="acctTab='cust';rAccts()">Customers</button><button aria-pressed="${k==='party'}" onclick="acctTab='party';rAccts()">Parties</button></div>
  <div class="card" style="padding:2px 14px">${list(k).length?sortedList(k).map(p=>{const s=stats(k,p.id);
    return`<button class="li" onclick="go('acct','${p.id}',{kind:'${k}',back:'accts'})"><span><span class="no">${p.no}</span>${esc(p.name)}<small>${esc(p.address||'')}</small></span><b class="${s.bal>0?(k==='cust'?'green':'red'):''}">${R(s.bal)}</b></button>`}).join(''):`<div class="empty">No ${k==='cust'?'customers':'parties'} yet.</div>`}</div>
  <p class="muted" style="font-size:12.5px">Account number 0 is built in: ${k==='cust'?'counter sale to a walk-in customer':'cash purchase without a party'}. No balance is kept for it.</p>
  <div class="btns"><button class="btn" onclick="personForm('${k}')">+ Add ${k==='cust'?'customer':'party'}</button></div>`;
}
function personForm(kind,edit){
  const e=edit?person(kind,edit):null;
  openDlg(`<h2>${e?'Edit':'Add'} ${kind==='cust'?'customer':'party'}</h2><div class="form" style="margin-top:12px">
  <div class="cols"><label for="pno">Account no.<input id="pno" type="number" inputmode="numeric" min="1" value="${e?e.no:nextAcctNo(kind)}"></label>
  <label for="pprev">Previous balance (Rs)<input id="pprev" type="number" inputmode="decimal" value="${e&&e.prev?e.prev:''}" placeholder="0"></label></div>
  <label for="pn">Name<input id="pn" autocomplete="off" value="${e?esc(e.name):''}"></label>
  <label for="pad">Address (optional)<input id="pad" autocomplete="off" value="${e?esc(e.address||''):''}"></label>
  <div class="muted" style="font-size:12.5px">Previous balance is what ${kind==='cust'?'this customer already owes you':'you already owe this party'} before using this app.</div><div class="err" id="er"></div>
  <div class="btns two"><button class="btn o" onclick="closeDlg()">Cancel</button><button class="btn" id="ok">Save</button></div></div>`);
  setTimeout(()=>$('#pn').focus(),50);

// ---------- stock in: purchase / added stock ----------
function lineRow(kind,v){
  v=v||{};
  const nameBox=`<label>Item<input class="l-name" placeholder="Type to search, e.g. fur" autocomplete="off" value="${esc(v.name||'')}"></label><div class="pick" hidden></div>`;
  if(kind==='buy')return`<div class="lineBox">${nameBox}
    <div class="cols3"><label>Qty<input class="l-qty" type="number" inputmode="decimal" min="0" value="${v.qty||''}"></label><label>Rate (Rs)<input class="l-rate" type="number" inputmode="decimal" min="0" value="${v.rate||''}"></label><label>Expiry (optional)<input class="l-exp" type="month" value="${v.exp||''}"></label></div></div>`;
  return`<div class="lineBox">${nameBox}<div class="muted l-info" style="font-size:12.5px"></div>
    <div class="cols"><label>Qty<input class="l-qty" type="number" inputmode="decimal" min="0" value="${v.qty||''}"></label><label>Price (Rs each)<input class="l-rate" type="number" inputmode="decimal" min="0" value="${v.rate||''}"></label></div></div>`;
}
function lastSalePrice(name){const k=name.trim().toLowerCase();const ts=db.tx.filter(t=>t.type==='sale').sort((a,b)=>b.seq-a.seq);for(const t of ts){const l=t.lines.find(x=>x.item.trim().toLowerCase()===k);if(l)return l.price}return ''}
function pickerSource(kind,extra){
  const stock={};stockItems().forEach(s=>stock[s.name.trim().toLowerCase()]=s.qty);
  const m={};
  if(kind==='sell'){Object.keys(stock).forEach(k=>m[k]={name:stockItems().find(s=>s.name.trim().toLowerCase()===k).name});(extra||[]).forEach(n=>{if(!m[n.trim().toLowerCase()])m[n.trim().toLowerCase()]={name:n}})}
  else db.lots.forEach(l=>{m[l.item.trim().toLowerCase()]={name:l.item,rate:l.rate}}); // newest lot wins
  return Object.entries(m).map(([k,s])=>({...s,qty:stock[k]||0,price:kind==='sell'?lastSalePrice(s.name):''}));
}
// type-ahead item search: type 1-2 letters, tap an item, rate fills in
function wirePicker(kind,row,v){
  const inp=row.querySelector('.l-name'),box=row.querySelector('.pick'),rate=row.querySelector('.l-rate'),qty=row.querySelector('.l-qty'),info=row.querySelector('.l-info');
  const src=pickerSource(kind,v&&v.extra);let selected=(v&&v.name)||null,res=[];
  const show=()=>{
    const toks=inp.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if(!toks.length||selected===inp.value){box.hidden=true;return}
    res=src.filter(s=>toks.every(t=>s.name.toLowerCase().includes(t))).sort((a,b)=>(+b.name.toLowerCase().startsWith(toks[0]))-(+a.name.toLowerCase().startsWith(toks[0]))||a.name.localeCompare(b.name)).slice(0,40);
    box.innerHTML=res.length?res.map((s,i)=>`<button type="button" class="li" data-i="${i}"><span>${esc(s.name)}<small>${s.qty} in stock${kind==='buy'&&s.rate?' · last rate '+R(s.rate):''}${kind==='sell'&&s.price?' · last price '+R(s.price):''}</small></span></button>`).join(''):`<div class="muted" style="padding:9px 0;font-size:13px">${kind==='sell'?'Not in stock':'New item. It will be added when you save.'}</div>`;
    box.hidden=false;
  };
  const choose=s=>{
    inp.value=s.name;selected=s.name;box.hidden=true;
    const def=kind==='buy'?s.rate:s.price;
    if(def&&!num(rate.value)){rate.value=def;rate.dispatchEvent(new Event('input'))}
    if(info)info.textContent=s.qty+' in stock';
    qty.focus();
  };
  box.addEventListener('click',e=>{const b=e.target.closest('button');if(b)choose(res[+b.dataset.i])});
  inp.addEventListener('input',()=>{selected=null;if(info)info.textContent='';show()});
  inp.addEventListener('focus',show);
  if(info&&selected){const it=src.find(s=>s.name===selected);if(it)info.textContent=it.qty+' in stock'}
}
function setupLines(kind,initial){
  const box=$('#lines');
  const tot=()=>{let t=0;box.querySelectorAll('.lineBox').forEach(r=>t+=num(r.querySelector('.l-qty').value)*num(r.querySelector('.l-rate').value));$('#tt').textContent=R(t)};
  const add=v=>{box.insertAdjacentHTML('beforeend',lineRow(kind,v));wirePicker(kind,box.lastElementChild,v);box.querySelectorAll('input,select').forEach(e=>e.oninput=tot)};
  (initial&&initial.length?initial:[{}]).forEach(add);$('#addLine').onclick=()=>add({extra:initial&&initial.extra});tot();
}
// undo a stock-affecting entry. returns an error text, or '' when done
function revertTx(t){
  if(t.type==='purchase'||t.type==='stock'){
    if(t.lines.some(l=>{const lot=db.lots.find(x=>x.id===l.lot);return lot&&lot.qty!==lot.orig}))return 'Some of this stock is already sold. Edit or delete those sales first.';
    db.lots=db.lots.filter(l=>!t.lines.some(x=>x.lot===l.id));
  }
  if(t.type==='sale')t.lines.forEach(l=>(l.from||[]).forEach(f=>{const lot=db.lots.find(x=>x.id===f.lot);if(lot)lot.qty+=f.qty}));
  db.tx=db.tx.filter(x=>x.id!==t.id);return '';
}
function buyForm(kind,who,edit){
  const isStock=kind==='stock',e=edit||null,sel=e?e.who:who||'';
  const initial=e?e.lines.map(l=>{const lot=db.lots.find(x=>x.id===l.lot)||{};return{name:l.item,qty:l.qty,rate:l.rate,exp:lot.expiry||''}}):null;
  openDlg(`<h2>${e?'Edit':'New'} ${isStock?'stock entry':'purchase invoice'}</h2>
  <div class="form" style="margin-top:12px">
  ${isStock?'<div class="muted" style="font-size:13px">Add stock you already have, without a party.</div>':`<label for="acc">Party<select id="acc">${acctOptions('party',sel,'Cash purchase (no party)')}</select></label><div class="muted" id="invno"></div>`}
  <label for="pd">Date<input id="pd" type="date" value="${e?e.date:today()}"></label>
  <div id="lines" class="form"></div><button class="btn o" id="addLine" type="button">+ Add another item</button>
  <div class="tot"><span>Total</span><span id="tt">Rs 0</span></div>
  ${isStock?'':`<label for="paid" id="paidBox">Paid now (Rs, leave empty if nothing paid)<input id="paid" type="number" inputmode="decimal" min="0" value="${e&&e.paid&&e.who!=='cash'?e.paid:''}"></label>`}
  <label for="pnote">Note (optional)<input id="pnote" placeholder="bill number…" value="${e?esc(e.note||''):''}"></label><div class="err" id="er"></div>
  <div class="btns two"><button class="btn o" onclick="closeDlg()">Cancel</button><button class="btn" id="ok">Save</button></div></div>`);
  setupLines('buy',initial);
  const upd=()=>{if(isStock)return;const a=$('#acc').value;$('#invno').textContent=a?'Invoice no. '+(e&&e.who===a?e.no:nextNo('purchase',a)):'';$('#paidBox').hidden=a==='cash'};
  if(!isStock){$('#acc').onchange=upd;upd()}
  $('#ok').onclick=()=>{
    const acc=isStock?'stock':$('#acc').value;
    if(!acc){$('#er').textContent='Select the party, or 0 for cash purchase';return}
    const date=$('#pd').value||today(),lines=[],lots=[];
    for(const r of document.querySelectorAll('#lines .lineBox')){
      const name=r.querySelector('.l-name').value.trim(),qty=num(r.querySelector('.l-qty').value),rate=num(r.querySelector('.l-rate').value),exp=r.querySelector('.l-exp').value;
      if(!name&&!qty&&!rate)continue;
      if(!name||qty<=0||rate<=0){$('#er').textContent='Each item needs a name, quantity and rate';return}
      const lot={id:uid(),item:name,qty,orig:qty,rate,expiry:exp||'',party:isStock?'':acc,date};lots.push(lot);lines.push({lot:lot.id,item:name,qty,rate});
    }
    if(!lines.length){$('#er').textContent='Add at least one item';return}
    const amount=lines.reduce((a,l)=>a+l.qty*l.rate,0);
    const paid=isStock?0:acc==='cash'?amount:Math.min(num($('#paid').value),amount);
    const snap=JSON.stringify(db);
    if(e){const err=revertTx(e);if(err){db=JSON.parse(snap);$('#er').textContent=err;return}}
    db.lots.push(...lots);
    db.tx.push({id:e?e.id:uid(),seq:e?e.seq:nextSeq(),type:kind,who:acc,date,amount,paid,lines,note:$('#pnote').value.trim(),no:e&&e.who===acc?e.no:nextNo(kind,acc)});
    save();closeDlg();render();toast(isStock?'Stock added':'Invoice saved, stock added');
  };
}

// ---------- sale ----------
function saleForm(who,edit){
  const e=edit||null,sel=e?e.who:who||'';
  if(!e&&!stockItems().length){toast('No stock to sell. Add stock first (Stock tab).');return}
  const initial=e?e.lines.map(l=>({name:l.item,qty:l.qty,rate:l.price,extra:e.lines.map(x=>x.item)})):null;
  if(initial)initial.extra=e.lines.map(x=>x.item);
  openDlg(`<h2>${e?'Edit':'New'} sale invoice</h2><div class="form" style="margin-top:12px">
  <label for="acc">Customer<select id="acc">${acctOptions('cust',sel,'Counter sale (no customer)')}</select></label><div class="muted" id="invno"></div>
  <label for="pd">Date<input id="pd" type="date" value="${e?e.date:today()}"></label>
  <div id="lines" class="form"></div><button class="btn o" id="addLine" type="button">+ Add another item</button>
  <div class="tot"><span>Total</span><span id="tt">Rs 0</span></div>
  <label for="rec" id="recBox">Received now (Rs, leave empty if nothing received)<input id="rec" type="number" inputmode="decimal" min="0" value="${e&&e.received&&e.who!=='cash'?e.received:''}"></label>
  <label for="pnote">Note (optional)<input id="pnote" value="${e?esc(e.note||''):''}"></label><div class="err" id="er"></div>
  <div class="btns two"><button class="btn o" onclick="closeDlg()">Cancel</button><button class="btn" id="ok">Save</button></div></div>`);
  setupLines('sell',initial);
  const upd=()=>{const a=$('#acc').value;$('#invno').textContent=a?'Invoice no. '+(e&&e.who===a?e.no:nextNo('sale',a)):'';$('#recBox').hidden=a==='cash'};$('#acc').onchange=upd;upd();
  $('#ok').onclick=()=>{
    const acc=$('#acc').value;
    if(!acc){$('#er').textContent='Select the customer, or 0 for counter sale';return}
    const date=$('#pd').value||today(),lines=[];
    for(const r of document.querySelectorAll('#lines .lineBox')){
      const name=r.querySelector('.l-name').value.trim(),qty=num(r.querySelector('.l-qty').value),price=num(r.querySelector('.l-rate').value);
      if(!name&&!qty&&!price)continue;
      if(!name||qty<=0||price<=0){$('#er').textContent='Each item needs an item, quantity and price';return}
      lines.push({item:name,qty,price});
    }
    if(!lines.length){$('#er').textContent='Add at least one item';return}
    const snap=JSON.stringify(db);
    if(e)revertTx(e);
    const need={};lines.forEach(l=>{const k=l.item.toLowerCase();need[k]=(need[k]||0)+l.qty});
    const items=stockItems();
    for(const k in need){const it=items.find(s=>s.name.toLowerCase()===k);if(!it||it.qty<need[k]){db=JSON.parse(snap);$('#er').textContent=it?'Not enough stock of '+it.name+' (only '+it.qty+' left)':'"'+k+'" is not in stock. Search and tap the item from the list.';return}}
    lines.forEach(l=>{const it=items.find(s=>s.name.toLowerCase()===l.item.toLowerCase());if(it)l.item=it.name});
    lines.forEach(l=>{ // earliest expiry first, then oldest
      let left=l.qty;l.from=[];
      const lots=db.lots.filter(x=>x.item.trim().toLowerCase()===l.item.trim().toLowerCase()&&x.qty>0).sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999')||a.date.localeCompare(b.date));
      for(const lot of lots){if(left<=0)break;const take=Math.min(lot.qty,left);lot.qty-=take;left-=take;l.from.push({lot:lot.id,qty:take,rate:lot.rate})}
    });
    const amount=lines.reduce((a,l)=>a+l.qty*l.price,0);
    const received=acc==='cash'?amount:Math.min(num($('#rec').value),amount);
    db.tx.push({id:e?e.id:uid(),seq:e?e.seq:nextSeq(),type:'sale',who:acc,date,amount,received,lines,note:$('#pnote').value.trim(),no:e&&e.who===acc?e.no:nextNo('sale',acc)});
    save();closeDlg();render();toast('Invoice saved, stock reduced');
  };
}

  openDlg(`<h2>${TXNAME[t.type]} #${t.no}</h2><div class="muted">${esc(whoLabel(t))} · ${fdate(t.date)}</div>${rows?`<div style="margin-top:8px">${rows}</div>`:''}
  <div class="tot" style="margin-top:8px"><span>Amount</span><span>${R(t.amount)}</span></div>
  ${t.type==='purchase'&&t.who!=='cash'?`<div class="tot"><span>Paid at purchase</span><span>${R(t.paid||0)}</span></div>`:''}${t.type==='sale'&&t.who!=='cash'?`<div class="tot"><span>Received at sale</span><span>${R(t.received||0)}</span></div>`:''}
  ${t.note?`<p class="muted">${esc(t.note)}</p>`:''}<div class="err" id="er"></div>
  <div class="btns two"><button class="btn" id="edit">Edit</button><button class="btn danger" id="del">Delete</button></div><div class="btns" style="margin-top:0"><button class="btn o" onclick="closeDlg()">Close</button></div>`);
  $('#edit').onclick=()=>{if(t.type==='sale')saleForm(null,t);else if(t.type==='purchase'||t.type==='stock')buyForm(t.type,null,t);else payForm(t.type,null,t)};
  $('#del').onclick=ev=>{const b=ev.target;if(!b.dataset.c){b.dataset.c=1;b.textContent='Tap again to delete';return}
    const snap=JSON.stringify(db);const err=revertTx(t);if(err){db=JSON.parse(snap);$('#er').textContent=err;return}
    save();closeDlg();render();toast('Deleted')};
}

// ---------- stock ----------
function rStock(){
  const items=stockItems(),exp=expiring();
  chrome('Stock','Total stock amount: '+R(stockTotal()),false,'stock');
  $('#app').innerHTML=`
  <div class="btns"><button class="btn" onclick="buyForm('stock')">+ Add stock (no party)</button></div>
  ${exp.length?`<h3>Expiring within 6 months</h3><div class="card" style="padding:2px 14px">${exp.map(l=>{const e=expiryInfo(l.expiry);return`<button class="li" onclick="editLots(decodeURIComponent('${enc(l.item)}'))"><span>${esc(l.item)}<small>Qty ${l.qty} · exp ${fexp(l.expiry)} · ${esc(lotSource(l))}</small></span><span class="pill ${e.k==='bad'?'bad':''}">${e.txt}</span></button>`}).join('')}</div>`:''}
  <h3>Stk View</h3><input id="ss" placeholder="Search stock: type 1-2 letters" autocomplete="off" value="${esc(stockTerm)}" aria-label="Search stock"><div class="card" id="slist" style="padding:2px 14px;margin-top:10px"></div>
  <p class="muted" style="font-size:12.5px">Tap an item to set expiry. To change a quantity or rate, edit the entry in the Invoice tab. Sales take the earliest expiry first.</p>`;
  const draw=()=>{
    const toks=stockTerm.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const rows=items.filter(i=>toks.every(t=>i.name.toLowerCase().includes(t)));
    $('#slist').innerHTML=rows.length?rows.slice(0,150).map(i=>`<button class="li" onclick="editLots(decodeURIComponent('${enc(i.name)}'))"><span>${esc(i.name)}<small>Qty ${i.qty} · ${i.lots.length>1?i.lots.length+' lots':'rate '+R(i.lots[0].rate)}${i.lots.some(l=>l.expiry)?'':' · no expiry set'}</small></span><b>${R(i.value)}</b></button>`).join('')+(rows.length>150?'<div class="empty">Showing 150 of '+rows.length+'. Search to narrow.</div>':''):`<div class="empty">${items.length?'No item matches.':'No stock yet. Tap "Add stock" for what you already have, or make a purchase invoice.'}</div>`;
  };
  $('#ss').oninput=e=>{stockTerm=e.target.value;draw()};draw();
}
function editLots(name){
  const lots=db.lots.filter(l=>l.item===name&&l.qty>0);if(!lots.length)return;
  openDlg(`<h2>${esc(name)}</h2><p class="muted" style="margin:2px 0 10px">Set expiry for each lot (optional). You get an alert 6 months before.</p><div class="form">
  ${lots.map(l=>`<div class="lineBox"><div class="muted">Qty ${l.qty} · rate ${R(l.rate)} · ${esc(lotSource(l))}, ${fdate(l.date)}</div><label>Expiry<input class="e-exp" type="month" data-id="${l.id}" value="${l.expiry||''}"></label></div>`).join('')}
  <div class="btns two"><button class="btn o" onclick="closeDlg()">Cancel</button><button class="btn" id="ok">Save</button></div></div>`);
  $('#ok').onclick=()=>{document.querySelectorAll('.e-exp').forEach(i=>{const l=db.lots.find(x=>x.id===i.dataset.id);if(l)l.expiry=i.value||''});save();closeDlg();render();toast('Saved')};
}

// ---------- shared database: login and live sync ----------
function showLogin(msg){
  chrome('Sajad Pharmacy','Log in',false,'');$('#tabs').hidden=true;
  $('#app').innerHTML=`<div class="card"><div class="form"><label for="em">Email<input id="em" type="email" autocomplete="username" autocapitalize="none" autocorrect="off"></label>
  <label for="pw">Password<input id="pw" type="password" autocomplete="current-password"></label><div class="err" id="er">${esc(msg||'')}</div><button class="btn" id="login">Log in</button></div></div>
  <p class="muted" style="font-size:13px">Ask the owner for your email and password.</p>`;
  const go1=()=>{
    const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||!pw){$('#er').textContent='Enter your email and password';return}
    $('#login').disabled=true;
    fbAuth.signInWithEmailAndPassword(em,pw).catch(e=>{$('#login').disabled=false;
      $('#er').textContent=/invalid|wrong|not-found|user-disabled/.test(e.code)?'Wrong email or password':/network/.test(e.code)?'No internet. The first login needs internet.':'Could not log in ('+e.code+')'})};
  $('#login').onclick=go1;$('#pw').onkeydown=e=>{if(e.key==='Enter')go1()};
}
let rq=false;
function scheduleRender(){ // do not disturb someone who is typing in the page
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('#app')&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){if(!rq){rq=true;a.addEventListener('blur',()=>{rq=false;setTimeout(render,60)},{once:true})}return}
  render();
}
function stopSync(){unsubs.forEach(u=>u());unsubs=[];ready=0}
function startSync(){
  stopSync();db=EMPTY();synced={parties:{},customers:{},lots:{},tx:{}};migChecked=false;render();
  COLS.forEach(c=>{
    let first=true;
    unsubs.push(fbStore.collection(c).onSnapshot(snap=>{
      const arr=[],sy={};
      snap.forEach(d=>{const x={...d.data(),id:d.id};if(c==='lots'&&x.item===undefined)return;arr.push(x);sy[d.id]=sig(x)});
      db[c]=arr;synced[c]=sy;
      if(first){first=false;ready++}
      if(ready>=COLS.length){scheduleRender();offerMigration()}
    },err=>toast('Sync problem: '+(err.code||err.message))));
  });
}
// one-time: move the data saved on this phone (older version) into the shared database
async function offerMigration(){
  if(migChecked)return;migChecked=true;
  let local=null;try{local=load()}catch(e){}
  if(!local||!(local.parties||[]).length&&!(local.customers||[]).length&&!(local.lots||[]).length)return;
  try{if(localStorage.getItem(KEY+'.skipmig')||localStorage.getItem(KEY+'.migrated'))return}catch(e){}
  try{
    for(const c of COLS){const r=await fbStore.collection(c).limit(1).get({source:'server'});if(!r.empty)return}
  }catch(e){return}
  openDlg(`<h2>Upload this phone's data?</h2><p class="muted">This phone has saved data: ${local.parties.length} parties, ${local.customers.length} customers, ${local.lots.length} stock lots, ${local.tx.length} entries. The shared database is empty. Upload it so everyone sees the same data.<br><br><b>Do this on one phone only, once.</b></p>
  <div class="btns two"><button class="btn o" id="mNo">Not now</button><button class="btn" id="mYes">Upload</button></div>`);
  $('#mNo').onclick=()=>{closeDlg()};
  $('#mYes').onclick=()=>{db={parties:local.parties||[],customers:local.customers||[],lots:local.lots||[],tx:local.tx||[]};save();try{localStorage.setItem(KEY+'.migrated','1')}catch(e){}closeDlg();render();toast('Uploaded')};
}
function boot(){
  if(!CLOUD){render();return}
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    fbAuth=firebase.auth();fbStore=firebase.firestore();
    if(window.FIREBASE_EMULATOR){fbStore.useEmulator(...window.FIREBASE_EMULATOR.fs);fbAuth.useEmulator(window.FIREBASE_EMULATOR.auth,{disableWarnings:true})}
    fbStore.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  }catch(e){$('#app').innerHTML='<div class="card err">Could not start the shared database: '+esc(e.message)+'</div>';return}
  fbAuth.onAuthStateChanged(u=>{user=u;if(u)startSync();else{stopSync();db=EMPTY();render()}});
  addEventListener('online',()=>render());addEventListener('offline',()=>render());
}
boot();
</script>
