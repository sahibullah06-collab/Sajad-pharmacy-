<!doctype html><html lang="en"><head>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f6b5c"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sajad Pharmacy">
<title>Sajad Pharmacy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: sticky top bar with tabs, one working panel below; tables scroll inside their own boxes */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --fg:#14211e; --muted:#5b6b67; --line:#d9e2df;
  --accent:#0f6b5c; --accent-fg:#ffffff; --accent-soft:#e1f0ec;
  --ok:#1d7a3e; --warn:#a15c00; --warn-soft:#fff1dc; --bad:#b42318; --bad-soft:#fde7e5;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#17221f; --fg:#e4eeeb; --muted:#97aaa5; --line:#2a3a36;
  --accent:#4fbfa8; --accent-fg:#06221c; --accent-soft:#18332d;
  --ok:#5fcf86; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#17221f; --fg:#e4eeeb; --muted:#97aaa5; --line:#2a3a36;
  --accent:#4fbfa8; --accent-fg:#06221c; --accent-soft:#18332d;
  --ok:#5fcf86; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1200px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{font:700 18px var(--font-head);display:flex;align-items:center;gap:8px}
.brand .cross{width:22px;height:22px;border-radius:5px;background:var(--accent);position:relative}
.brand .cross::before,.brand .cross::after{content:"";position:absolute;background:var(--accent-fg);left:50%;top:50%;transform:translate(-50%,-50%)}
.brand .cross::before{width:12px;height:4px}.brand .cross::after{width:4px;height:12px}
.brand small{font:500 12px var(--font-body);color:var(--muted)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font:600 14px var(--font-body);cursor:pointer}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
main{padding-block:20px 48px}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
h1{font-size:22px}h2{font-size:17px}
.sec-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tile .val{font:700 24px var(--font-head);font-variant-numeric:tabular-nums;margin-top:4px}
.tile.warn .val{color:var(--warn)}.tile.bad .val{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.tbl{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--accent-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:8px;font:600 14px var(--font-body);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:14px var(--font-body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{max-width:320px}
.muted{color:var(--muted)}
.empty{padding:20px;text-align:center;color:var(--muted)}
.results{display:grid;gap:6px;margin-top:10px;max-height:340px;overflow:auto}
.result{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg);text-align:left;color:var(--fg);font:14px var(--font-body);width:100%}
.result:hover{border-color:var(--accent)}
.result[disabled]{opacity:.5;cursor:not-allowed}
.total{display:grid;gap:6px;margin-top:12px;font-variant-numeric:tabular-nums}
.total div{display:flex;justify-content:space-between}
.total .grand{font:700 20px var(--font-head);border-top:1px solid var(--line);padding-top:8px}
.qty{width:70px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);padding:20px;width:min(640px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20}
.receipt{font:13px/1.45 ui-monospace,"Consolas",monospace;max-width:320px;margin:0 auto;color:#000;background:#fff;padding:12px}
.receipt h3{font:700 16px ui-monospace,monospace;text-align:center}
.receipt .c{text-align:center}.receipt hr{border:0;border-top:1px dashed #000}
.receipt table td,.receipt table th{padding:2px 0;border:0;color:#000;font-size:12px;text-transform:none;letter-spacing:0}
.note{font-size:12px;color:var(--muted);margin-top:8px}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header><div class="wrap bar">
  <div class="brand"><span class="cross" aria-hidden="true"></span><span id="shopNameEl">Sajad Pharmacy</span> <small>Manager</small></div>
  <nav id="nav">
    <button data-v="dash">Dashboard</button>
    <button data-v="sale">New Sale</button>
    <button data-v="stock">Medicines &amp; Stock</button>
    <button data-v="history">Sales</button>
    <button data-v="settings">Settings &amp; Backup</button>
  </nav>
</div></header>

<main class="wrap" id="app"></main>
<div id="printArea" hidden></div>

<dialog id="dlg"></dialog>

<script>
// ---------- storage ----------
const KEY='medstore.v1';
const SHOP_DEFAULT={shop:'Sajad Pharmacy',address:'Hayatabad Medical Complex',phone:'0332 9293816',expiryDays:90,currency:'Rs'};
let db;
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Could not save. Browser storage is blocked.')}}
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toISOString().slice(0,10);
function ym(offsetMonths){const d=new Date();d.setMonth(d.getMonth()+offsetMonths);return d.toISOString().slice(0,7)}
function seed(){
  const m=(name,generic,company,form,batch,exp,qty,cost,price,min)=>({id:uid(),name,generic,company,form,batch,expiry:exp,qty,cost,price,min});
  return {settings:{...SHOP_DEFAULT},seq:1,
    items:[
      m('Panadol 500mg','Paracetamol','GSK','Tablet','PN2401',ym(14),240,1.6,2.0,50),
      m('Augmentin 625mg','Amoxicillin + Clavulanate','GSK','Tablet','AG3317',ym(2),18,38,45,20),
      m('Brufen 400mg','Ibuprofen','Abbott','Tablet','BR1190',ym(9),120,2.9,3.5,40),
      m('Risek 20mg','Omeprazole','Getz Pharma','Capsule','RS7781',ym(1),60,11,13.5,30),
      m('Flagyl 400mg','Metronidazole','Sanofi','Tablet','FL5520',ym(-1),35,2.2,2.8,30),
      m('Hydryllin Syrup 120ml','Diphenhydramine','Searle','Syrup','HY0902',ym(11),8,95,120,10),
      m('ORS Sachet','Oral Rehydration Salts','Searle','Sachet','OR4410',ym(18),150,18,25,40),
      m('Softin 10mg','Loratadine','Hilton','Tablet','SF2208',ym(6),90,4.5,6,30)
    ],sales:[]};
}
db=load()||seed();
// shops still on the old placeholder details get Sajad Pharmacy's details
if(db.settings.shop==='Medical Store'&&db.settings.address==='Main Bazaar')Object.assign(db.settings,{shop:SHOP_DEFAULT.shop,address:SHOP_DEFAULT.address,phone:SHOP_DEFAULT.phone});
save();

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>db.settings.currency+' '+(Math.round(n*100)/100).toLocaleString('en-PK',{minimumFractionDigits:0,maximumFractionDigits:2});
function expiryState(it){
  const end=new Date(it.expiry+'-01');end.setMonth(end.getMonth()+1);end.setDate(0); // last day of expiry month
  const days=Math.floor((end-new Date())/864e5);
  if(days<0)return{k:'bad',t:'Expired',days};
  if(days<=db.settings.expiryDays)return{k:'warn',t:'Expires in '+days+' d',days};
  return{k:'ok',t:'OK',days};
}
const fmtExp=e=>{const [y,m]=e.split('-');return m+'/'+y};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

// ---------- routing ----------
let view='dash';
function go(v){view=v;try{localStorage.setItem(KEY+'.view',v)}catch(e){}render()}
try{view=localStorage.getItem(KEY+'.view')||'dash'}catch(e){}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===view));
  $('#shopNameEl').textContent=db.settings.shop;
  ({dash:renderDash,sale:renderSale,stock:renderStock,history:renderHistory,settings:renderSettings}[view]||renderDash)();
}

// ---------- dashboard ----------
function renderDash(){
  const t=today();
  const todays=db.sales.filter(s=>s.date.slice(0,10)===t);
  const todayTotal=todays.reduce((a,s)=>a+s.total,0);
  const todayProfit=todays.reduce((a,s)=>a+s.lines.reduce((b,l)=>b+(l.price-l.cost)*l.qty,0)-s.discount,0);
  const low=db.items.filter(i=>i.qty<=i.min);
  const exp=db.items.filter(i=>i.qty>0&&expiryState(i).k!=='ok').sort((a,b)=>a.expiry.localeCompare(b.expiry));
  const stockVal=db.items.reduce((a,i)=>a+i.qty*i.cost,0);
  $('#app').innerHTML=`
  <div class="sec-head"><h1>Today, ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</h1>
    <button class="btn primary" onclick="go('sale')">+ New sale</button></div>
  <div class="tiles">
    <div class="tile"><div class="lbl">Today's sales</div><div class="val">${money(todayTotal)}</div><div class="muted">${todays.length} bills</div></div>
    <div class="tile"><div class="lbl">Today's profit</div><div class="val">${money(todayProfit)}</div></div>
    <div class="tile"><div class="lbl">Stock value (cost)</div><div class="val">${money(stockVal)}</div><div class="muted">${db.items.length} batches</div></div>
    <div class="tile ${low.length?'warn':''}"><div class="lbl">Low stock</div><div class="val">${low.length}</div></div>
    <div class="tile ${exp.some(i=>expiryState(i).k==='bad')?'bad':exp.length?'warn':''}"><div class="lbl">Expired / expiring</div><div class="val">${exp.length}</div></div>
  </div>
  <div class="two">
    <div class="panel"><h2>Expiry alerts</h2><p class="muted" style="margin:4px 0 8px">Expired, or expiring within ${db.settings.expiryDays} days</p>
      ${exp.length?`<div class="tbl"><table><tr><th>Medicine</th><th>Batch</th><th>Expiry</th><th class="num">Qty</th><th>Status</th></tr>
      ${exp.map(i=>{const s=expiryState(i);return`<tr><td>${esc(i.name)}</td><td>${esc(i.batch)}</td><td>${fmtExp(i.expiry)}</td><td class="num">${i.qty}</td><td><span class="pill ${s.k}">${s.t}</span></td></tr>`}).join('')}</table></div>`:'<div class="empty">No expiry problems.</div>'}
    </div>
    <div class="panel"><h2>Low stock, reorder</h2><p class="muted" style="margin:4px 0 8px">Quantity at or below its minimum level</p>
      ${low.length?`<div class="tbl"><table><tr><th>Medicine</th><th>Company</th><th class="num">Qty</th><th class="num">Min</th></tr>
      ${low.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.company)}</td><td class="num"><span class="pill warn">${i.qty}</span></td><td class="num">${i.min}</td></tr>`).join('')}</table></div>`:'<div class="empty">All stock is above minimum.</div>'}
    </div>
  </div>
  <div class="panel" style="margin-top:16px"><h2>Recent bills</h2>${salesTable(db.sales.slice(-5).reverse())}</div>`;
}

// ---------- sale / POS ----------
let cart=[],cartCustomer='',cartDiscount=0;
function renderSale(){
  $('#app').innerHTML=`
  <div class="sec-head"><h1>New sale</h1></div>
  <div class="two">
    <div class="panel"><label for="q">Search medicine (name, generic or batch)</label>
      <input id="q" placeholder="e.g. panadol" autocomplete="off">
      <div class="results" id="res"></div>
      <p class="note">Expired batches cannot be sold. Batches are listed earliest expiry first.</p></div>
    <div class="panel"><h2>Bill</h2>
      <div class="form" style="margin:10px 0"><label for="cust">Customer (optional)<input id="cust" value="${esc(cartCustomer)}"></label>
        <label for="disc">Discount (${db.settings.currency})<input id="disc" type="number" min="0" value="${cartDiscount||''}"></label></div>
      <div id="cartBox"></div>
      <div class="row" style="margin-top:14px;justify-content:flex-end">
        <button class="btn" onclick="cart=[];cartCustomer='';cartDiscount=0;renderSale()">Clear</button>
        <button class="btn primary" id="checkout">Save &amp; print bill</button></div>
    </div>
  </div>`;
  const q=$('#q');q.focus();
  q.addEventListener('input',()=>showResults(q.value));
  q.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=$('#res .result:not([disabled])');if(f)f.click()}});
  $('#cust').addEventListener('input',e=>cartCustomer=e.target.value);
  $('#disc').addEventListener('input',e=>{cartDiscount=Math.max(0,+e.target.value||0);drawCart()});
  $('#checkout').addEventListener('click',checkout);
  showResults('');drawCart();
}
function showResults(term){
  term=term.trim().toLowerCase();
  const list=db.items.filter(i=>!term||(i.name+' '+i.generic+' '+i.batch).toLowerCase().includes(term))
    .sort((a,b)=>a.name.localeCompare(b.name)||a.expiry.localeCompare(b.expiry)).slice(0,30);
  $('#res').innerHTML=list.length?list.map(i=>{const s=expiryState(i);const dis=s.k==='bad'||i.qty<=0;
    return`<button class="result" data-id="${i.id}" ${dis?'disabled':''}><span><b>${esc(i.name)}</b><br><span class="muted">${esc(i.generic)} · Batch ${esc(i.batch)} · Exp ${fmtExp(i.expiry)}</span></span>
    <span style="text-align:right">${money(i.price)}<br><span class="pill ${i.qty<=0?'bad':s.k}">${i.qty<=0?'Out of stock':s.k==='bad'?'Expired':i.qty+' in stock'}</span></span></button>`}).join('')
    :'<div class="empty">No medicine found. Add it under Medicines &amp; Stock.</div>';
  $('#res').querySelectorAll('.result').forEach(b=>b.addEventListener('click',()=>addToCart(b.dataset.id)));
}
function addToCart(id){
  const it=db.items.find(i=>i.id===id);const line=cart.find(l=>l.id===id);
  if(line){if(line.qty<it.qty)line.qty++;else toast('Only '+it.qty+' in stock')}else cart.push({id,qty:1});
  drawCart();
}
function cartTotals(){const sub=cart.reduce((a,l)=>{const it=db.items.find(i=>i.id===l.id);return a+(it?it.price*l.qty:0)},0);return{sub,total:Math.max(0,sub-cartDiscount)}}
function drawCart(){
  const box=$('#cartBox');if(!box)return;
  if(!cart.length){box.innerHTML='<div class="empty">Search and click a medicine to add it to the bill.</div>';return}
  const {sub,total}=cartTotals();
  box.innerHTML=`<div class="tbl"><table><tr><th>Medicine</th><th class="num">Rate</th><th class="num">Qty</th><th class="num">Amount</th><th></th></tr>
  ${cart.map((l,ix)=>{const it=db.items.find(i=>i.id===l.id);return`<tr><td>${esc(it.name)}<br><span class="muted">${esc(it.batch)}</span></td><td class="num">${money(it.price)}</td>
  <td class="num"><input class="qty" type="number" min="1" max="${it.qty}" value="${l.qty}" data-ix="${ix}" aria-label="Quantity"></td><td class="num">${money(it.price*l.qty)}</td>
  <td><button class="btn sm danger" data-rm="${ix}" aria-label="Remove">✕</button></td></tr>`}).join('')}</table></div>
  <div class="total"><div><span>Subtotal</span><span>${money(sub)}</span></div><div><span>Discount</span><span>− ${money(cartDiscount)}</span></div>
  <div class="grand"><span>Total</span><span>${money(total)}</span></div></div>`;
  box.querySelectorAll('.qty').forEach(inp=>inp.addEventListener('change',()=>{const l=cart[inp.dataset.ix];const it=db.items.find(i=>i.id===l.id);
    let v=Math.floor(+inp.value)||1;if(v>it.qty){v=it.qty;toast('Only '+it.qty+' in stock')}l.qty=Math.max(1,v);drawCart()}));
  box.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{cart.splice(+b.dataset.rm,1);drawCart()}));
}
function checkout(){
  if(!cart.length){toast('The bill is empty');return}
  const {sub,total}=cartTotals();
  const lines=cart.map(l=>{const it=db.items.find(i=>i.id===l.id);it.qty-=l.qty;return{itemId:it.id,name:it.name,batch:it.batch,expiry:it.expiry,qty:l.qty,price:it.price,cost:it.cost}});
  const sale={id:uid(),no:db.seq++,date:new Date().toISOString(),customer:cartCustomer.trim(),lines,subtotal:sub,discount:Math.min(cartDiscount,sub),total};
  db.sales.push(sale);save();cart=[];cartCustomer='';cartDiscount=0;
  renderSale();showReceipt(sale);toast('Bill #'+sale.no+' saved');
}

// ---------- receipt ----------
function receiptHTML(s){const st=db.settings;return`<div class="receipt"><h3>${esc(st.shop)}</h3><div class="c">${esc(st.address)}${st.phone?'<br>Ph: '+esc(st.phone):''}</div><hr>
  <div>Bill #${s.no}<span style="float:right">${new Date(s.date).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'})}</span></div>${s.customer?'<div>Customer: '+esc(s.customer)+'</div>':''}<hr>
  <table style="width:100%"><tr><th>Item</th><th class="num">Qty</th><th class="num">Amt</th></tr>${s.lines.map(l=>`<tr><td>${esc(l.name)}<br><small>${esc(l.batch)} exp ${fmtExp(l.expiry)} @ ${l.price}</small></td><td class="num">${l.qty}</td><td class="num">${(l.price*l.qty).toFixed(2)}</td></tr>`).join('')}</table><hr>
  <div>Subtotal<span style="float:right">${s.subtotal.toFixed(2)}</span></div>${s.discount?`<div>Discount<span style="float:right">-${s.discount.toFixed(2)}</span></div>`:''}
  <div><b>TOTAL ${esc(st.currency)}</b><span style="float:right"><b>${s.total.toFixed(2)}</b></span></div><hr><div class="c">Thank you. Get well soon.</div></div>`}
function showReceipt(s){
  const d=$('#dlg');d.innerHTML=`${receiptHTML(s)}<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="dClose">Close</button><button class="btn primary" id="dPrint">Print</button></div>`;
  d.showModal();$('#dClose').onclick=()=>d.close();
  $('#dPrint').onclick=()=>{const p=$('#printArea');p.innerHTML=receiptHTML(s);p.hidden=false;d.close();window.print();setTimeout(()=>p.hidden=true,500)};
}

// ---------- stock ----------
let stockFilter='all',stockTerm='';
function renderStock(){
  const items=db.items.filter(i=>{const s=expiryState(i);
    if(stockFilter==='low'&&i.qty>i.min)return false;
    if(stockFilter==='exp'&&s.k==='ok')return false;
    return !stockTerm||(i.name+' '+i.generic+' '+i.company+' '+i.batch).toLowerCase().includes(stockTerm)}).sort((a,b)=>a.name.localeCompare(b.name)||a.expiry.localeCompare(b.expiry));
  $('#app').innerHTML=`
  <div class="sec-head"><h1>Medicines &amp; stock</h1><button class="btn primary" onclick="editItem()">+ Add medicine / new batch</button></div>
  <div class="row" style="margin-bottom:12px"><input class="search" id="sq" placeholder="Search name, generic, company, batch" value="${esc(stockTerm)}">
    <select id="sf" style="width:auto"><option value="all">All</option><option value="low">Low stock</option><option value="exp">Expired / expiring</option></select></div>
  <div class="panel tbl">${items.length?`<table><tr><th>Medicine</th><th>Generic</th><th>Company</th><th>Batch</th><th>Expiry</th><th class="num">Qty</th><th class="num">Cost</th><th class="num">Sale price</th><th></th></tr>
  ${items.map(i=>{const s=expiryState(i);return`<tr><td><b>${esc(i.name)}</b><br><span class="muted">${esc(i.form)}</span></td><td>${esc(i.generic)}</td><td>${esc(i.company)}</td><td>${esc(i.batch)}</td>
  <td>${fmtExp(i.expiry)} ${s.k!=='ok'?`<span class="pill ${s.k}">${s.k==='bad'?'Expired':s.days+' d'}</span>`:''}</td>
  <td class="num">${i.qty<=i.min?`<span class="pill warn">${i.qty}</span>`:i.qty}</td><td class="num">${money(i.cost)}</td><td class="num">${money(i.price)}</td>
  <td><div class="row"><button class="btn sm" onclick="editItem('${i.id}')">Edit</button><button class="btn sm" onclick="editItem('${i.id}',true)">+ Batch</button></div></td></tr>`}).join('')}</table>`:'<div class="empty">No medicines match.</div>'}</div>`;
  $('#sf').value=stockFilter;
  $('#sf').onchange=e=>{stockFilter=e.target.value;renderStock()};
  const sq=$('#sq');sq.oninput=e=>{stockTerm=e.target.value.toLowerCase();const p=sq.selectionStart;renderStock();const n=$('#sq');n.focus();n.setSelectionRange(p,p)};
}
function editItem(id,newBatch){
  const src=id?db.items.find(i=>i.id===id):null;
  const it=src?{...src}:{name:'',generic:'',company:'',form:'Tablet',batch:'',expiry:ym(12),qty:0,cost:0,price:0,min:10};
  if(newBatch){it.batch='';it.expiry=ym(12);it.qty=0}
  const editing=src&&!newBatch;
  const d=$('#dlg');
  d.innerHTML=`<h2>${editing?'Edit medicine':newBatch?'New batch: '+esc(it.name):'Add medicine'}</h2>
  <form id="f" class="form" style="margin-top:14px">
    <label for="f_name">Brand name *<input id="f_name" required value="${esc(it.name)}"></label>
    <label for="f_generic">Generic / formula<input id="f_generic" value="${esc(it.generic)}"></label>
    <label for="f_company">Company<input id="f_company" value="${esc(it.company)}"></label>
    <label for="f_form">Form<select id="f_form">${['Tablet','Capsule','Syrup','Injection','Drops','Cream / Ointment','Sachet','Inhaler','Other'].map(o=>`<option ${o===it.form?'selected':''}>${o}</option>`).join('')}</select></label>
    <label for="f_batch">Batch no. *<input id="f_batch" required value="${esc(it.batch)}"></label>
    <label for="f_expiry">Expiry (month) *<input id="f_expiry" type="month" required value="${it.expiry}"></label>
    <label for="f_qty">${editing?'Quantity in stock':'Quantity received'} *<input id="f_qty" type="number" min="0" required value="${it.qty}"></label>
    <label for="f_min">Minimum stock level<input id="f_min" type="number" min="0" value="${it.min}"></label>
    <label for="f_cost">Purchase price (per unit)<input id="f_cost" type="number" min="0" step="0.01" value="${it.cost}"></label>
    <label for="f_price">Sale price (per unit) *<input id="f_price" type="number" min="0" step="0.01" required value="${it.price}"></label>
  </form>
  <div class="row" style="justify-content:space-between;margin-top:16px">
    <span>${editing?'<button class="btn danger" id="dDel">Delete</button>':''}</span>
    <span class="row"><button class="btn" id="dCancel">Cancel</button><button class="btn primary" id="dSave">Save</button></span></div>`;
  d.showModal();
  $('#dCancel').onclick=()=>d.close();
  if(editing)$('#dDel').onclick=()=>{const b=$('#dDel');if(b.dataset.c){db.items=db.items.filter(x=>x.id!==id);save();d.close();renderStock();toast('Deleted')}else{b.dataset.c=1;b.textContent='Click again to delete'}};
  $('#dSave').onclick=()=>{
    const f=$('#f');if(!f.reportValidity())return;
    const v=k=>$('#f_'+k).value.trim();
    const rec={name:v('name'),generic:v('generic'),company:v('company'),form:v('form'),batch:v('batch'),expiry:v('expiry'),qty:Math.floor(+v('qty')),min:+v('min')||0,cost:+v('cost')||0,price:+v('price')||0};
    if(editing)Object.assign(src,rec);
    else{const same=db.items.find(x=>x.name.toLowerCase()===rec.name.toLowerCase()&&x.batch.toLowerCase()===rec.batch.toLowerCase());
      if(same){same.qty+=rec.qty;Object.assign(same,{...rec,qty:same.qty})}else db.items.push({id:uid(),...rec})}
    save();d.close();renderStock();toast('Saved');
  };
}

// ---------- history ----------
function salesTable(list){
  if(!list.length)return'<div class="empty">No bills yet. Make one from New Sale.</div>';
  return`<div class="tbl"><table><tr><th>Bill #</th><th>Date</th><th>Customer</th><th class="num">Items</th><th class="num">Total</th><th></th></tr>
  ${list.map(s=>`<tr><td>${s.no}</td><td>${new Date(s.date).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})}</td><td>${esc(s.customer)||'<span class="muted">Walk-in</span>'}</td>
  <td class="num">${s.lines.reduce((a,l)=>a+l.qty,0)}</td><td class="num">${money(s.total)}</td><td><button class="btn sm" onclick="showReceipt(db.sales.find(x=>x.id==='${s.id}'))">View bill</button></td></tr>`).join('')}</table></div>`;
}
let hFrom='',hTo='';
function renderHistory(){
  if(!hFrom){hFrom=today();hTo=today()}
  const list=db.sales.filter(s=>{const d=s.date.slice(0,10);return d>=hFrom&&d<=hTo}).reverse();
  const tot=list.reduce((a,s)=>a+s.total,0),profit=list.reduce((a,s)=>a+s.lines.reduce((b,l)=>b+(l.price-l.cost)*l.qty,0)-s.discount,0);
  const byItem={};list.forEach(s=>s.lines.forEach(l=>{byItem[l.name]=byItem[l.name]||{q:0,a:0};byItem[l.name].q+=l.qty;byItem[l.name].a+=l.qty*l.price}));
  const top=Object.entries(byItem).sort((a,b)=>b[1].a-a[1].a).slice(0,8);
  $('#app').innerHTML=`
  <div class="sec-head"><h1>Sales report</h1>
    <div class="row"><label for="hf">From<input id="hf" type="date" value="${hFrom}"></label><label for="ht">To<input id="ht" type="date" value="${hTo}"></label></div></div>
  <div class="tiles"><div class="tile"><div class="lbl">Total sales</div><div class="val">${money(tot)}</div></div>
    <div class="tile"><div class="lbl">Profit</div><div class="val">${money(profit)}</div></div>
    <div class="tile"><div class="lbl">Bills</div><div class="val">${list.length}</div></div></div>
  <div class="two"><div class="panel"><h2>Bills</h2>${salesTable(list)}</div>
  <div class="panel"><h2>Top medicines</h2>${top.length?`<div class="tbl"><table><tr><th>Medicine</th><th class="num">Qty</th><th class="num">Amount</th></tr>${top.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="num">${v.q}</td><td class="num">${money(v.a)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No sales in this period.</div>'}</div></div>`;
  $('#hf').onchange=e=>{hFrom=e.target.value;renderHistory()};$('#ht').onchange=e=>{hTo=e.target.value;renderHistory()};
}

// ---------- settings & backup ----------
function renderSettings(){
  const st=db.settings;
  $('#app').innerHTML=`
  <div class="sec-head"><h1>Settings &amp; backup</h1></div>
  <div class="grid">
  <div class="panel"><h2>Shop details (printed on bills)</h2>
    <form class="form" id="sform" style="margin-top:12px">
      <label for="s_shop">Shop name<input id="s_shop" value="${esc(st.shop)}"></label>
      <label for="s_address">Address<input id="s_address" value="${esc(st.address)}"></label>
      <label for="s_phone">Phone<input id="s_phone" value="${esc(st.phone)}"></label>
      <label for="s_currency">Currency<input id="s_currency" value="${esc(st.currency)}"></label>
      <label for="s_exp">Expiry warning (days)<input id="s_exp" type="number" min="1" value="${st.expiryDays}"></label>
    </form><div class="row" style="margin-top:12px"><button class="btn primary" id="sSave">Save settings</button></div></div>
  <div class="panel"><h2>Backup</h2>
    <p class="muted">All data is stored in this browser on this computer. Copy a backup regularly and keep it safe (USB, email, WhatsApp to yourself).</p>
    <div class="row"><button class="btn" id="bCopy">Copy backup text</button><button class="btn" id="bShow">Restore from backup</button></div>
    <textarea id="bTxt" hidden style="width:100%;height:140px;margin-top:10px;font:12px ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px"></textarea>
    <div class="row" id="bRestoreRow" hidden style="margin-top:8px"><button class="btn primary" id="bRestore">Replace all data with this backup</button></div></div>
  <div class="panel"><h2>Start fresh</h2><p class="muted">The app opens with example medicines so you can try it. Remove them before real use.</p>
    <button class="btn danger" id="wipe">Delete all data</button></div>
  </div>`;
  $('#sSave').onclick=()=>{Object.assign(st,{shop:$('#s_shop').value.trim()||'Medical Store',address:$('#s_address').value.trim(),phone:$('#s_phone').value.trim(),currency:$('#s_currency').value.trim()||'Rs',expiryDays:+$('#s_exp').value||90});save();render();toast('Settings saved')};
  const txt=$('#bTxt');
  $('#bCopy').onclick=()=>{const s=JSON.stringify(db);txt.hidden=false;txt.value=s;$('#bRestoreRow').hidden=true;
    navigator.clipboard?.writeText(s).then(()=>toast('Backup copied')).catch(()=>{txt.select();toast('Select all and copy the text')})};
  $('#bShow').onclick=()=>{txt.hidden=false;txt.value='';txt.placeholder='Paste backup text here';$('#bRestoreRow').hidden=false;txt.focus()};
  $('#bRestore').onclick=()=>{try{const d=JSON.parse(txt.value);if(!d.items||!d.sales)throw 0;db=d;save();render();toast('Backup restored')}catch(e){toast('That text is not a valid backup')}};
  $('#wipe').onclick=e=>{const b=e.target;if(b.dataset.c){db={settings:st,seq:1,items:[],sales:[]};save();render();toast('All data deleted')}else{b.dataset.c=1;b.textContent='Click again to delete everything'}};
}

render();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script></html>
