<!doctype html><html lang="en"><head>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f6b5c"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sajad Pharmacy">
<title>Sajad Pharmacy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: phone-first. Top bar, one page at a time, bottom tab bar (Home, Parties, Customers, Stock). */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --fg:#14211e; --muted:#5b6b67; --line:#d9e2df;
  --accent:#0f6b5c; --accent-fg:#ffffff; --accent-soft:#e1f0ec;
  --good:#1d7a3e; --warn:#a15c00; --warn-soft:#fff1dc; --bad:#b42318; --bad-soft:#fde7e5;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#17221f; --fg:#e4eeeb; --muted:#97aaa5; --line:#2a3a36;
  --accent:#4fbfa8; --accent-fg:#06221c; --accent-soft:#18332d;
  --good:#5fcf86; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#17221f; --fg:#e4eeeb; --muted:#97aaa5; --line:#2a3a36;
  --accent:#4fbfa8; --accent-fg:#06221c; --accent-soft:#18332d;
  --good:#5fcf86; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-fg)}
header .wrap{padding-block:12px;display:flex;align-items:center;gap:10px}
header h1{font:700 18px var(--font-head);margin:0;flex:1}
header small{display:block;font:400 12px var(--font-body);opacity:.85}
header .back{background:none;border:0;color:inherit;font-size:22px;cursor:pointer;padding:0 6px 0 0;display:none}
main{padding-block:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.big{font:700 24px var(--font-head);font-variant-numeric:tabular-nums}
.red{color:var(--bad)}.green{color:var(--good)}.amber{color:var(--warn)}.muted{color:var(--muted)}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-weight:600;cursor:pointer;display:block;width:100%;border:0;text-align:left;font:600 14px var(--font-body)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--fg);text-align:left;font:15px var(--font-body)}
.li:last-child{border-bottom:0}
.li small{display:block;color:var(--muted);font-size:12.5px}
.li b{font-variant-numeric:tabular-nums;white-space:nowrap}
.nolink{cursor:default}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.btn{display:block;width:100%;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);padding:12px;border-radius:10px;font:700 15px var(--font-body);cursor:pointer;text-align:center}
.btn.o{background:var(--surface);color:var(--accent)}
.btn.danger{background:var(--surface);border-color:var(--line);color:var(--bad)}
.btn.sm{display:inline-block;width:auto;padding:6px 12px;font-size:13px}
.btns{display:grid;gap:8px;margin:12px 0}
.btns.two{grid-template-columns:1fr 1fr}
input,select{font:16px var(--font-body);padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.form{display:grid;gap:10px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lineBox{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabs button{flex:1;background:none;border:0;border-top:3px solid transparent;padding:11px 0;color:var(--muted);font:600 12.5px var(--font-body);cursor:pointer}
.tabs button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:18px;width:min(560px,calc(100vw - 24px));max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
h2{font:700 17px var(--font-head);margin:0 0 4px}
h3{font:700 14px var(--font-head);margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:30;max-width:90vw}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:18px}
.tot{display:flex;justify-content:space-between;font-weight:700;padding-top:4px}
textarea{width:100%;height:120px;font:12px ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header><div class="wrap">
  <button class="back" id="back" aria-label="Back">‹</button>
  <h1 id="title">Sajad Pharmacy<small id="sub"></small></h1>
</div></header>
<main class="wrap" id="app"></main>
<nav class="tabs" id="tabs">
  <button data-v="home">Home</button><button data-v="parties">Parties</button><button data-v="customers">Customers</button><button data-v="stock">Stock</button>
</nav>
<dialog id="dlg"></dialog>

<script>
// ---------- data ----------
const KEY='ledger.v1';
const EMPTY=()=>({shop:{name:'Sajad Pharmacy',place:'Hayatabad Medical Complex',phone:'0332 9293816'},parties:[],customers:[],lots:[],tx:[]});
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return null}
let db=load()||EMPTY();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Could not save: browser storage is blocked')}}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const R=n=>'Rs '+Math.round(n).toLocaleString('en-PK');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=d=>{const [y,m,dd]=d.split('-');return dd+'/'+m+'/'+y};
const fexp=e=>e?e.slice(5)+'/'+e.slice(0,4):'—';
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}

// ---------- calculations ----------
const partyStats=id=>{let bought=0,paid=0;db.tx.forEach(t=>{if(t.who!==id)return;if(t.type==='purchase'){bought+=t.amount;paid+=t.paid||0}if(t.type==='pay')paid+=t.amount});return{bought,paid,owe:bought-paid}};
const custStats=id=>{let given=0,recv=0;db.tx.forEach(t=>{if(t.who!==id)return;if(t.type==='sale'){given+=t.amount;recv+=t.received||0}if(t.type==='recv')recv+=t.amount});return{given,recv,due:given-recv}};
function expiryInfo(e){ // e = 'YYYY-MM'
  if(!e)return null;const [y,m]=e.split('-').map(Number);const end=new Date(y,m,0,23,59,59);
  const days=Math.floor((end-new Date())/864e5);
  if(days<0)return{k:'bad',txt:'Expired',days};
  if(days<=183)return{k:'warn',txt:Math.max(1,Math.round(days/30))+' mo left',days};
  return null;
}
function stockItems(){
  const map={};
  db.lots.filter(l=>l.qty>0).forEach(l=>{const k=l.item.trim().toLowerCase();(map[k]=map[k]||{name:l.item,qty:0,value:0,lots:[]});const it=map[k];it.qty+=l.qty;it.value+=l.qty*l.rate;it.lots.push(l)});
  return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name));
}
const expiring=()=>db.lots.filter(l=>l.qty>0&&expiryInfo(l.expiry)).sort((a,b)=>a.expiry.localeCompare(b.expiry));
const partyName=id=>(db.parties.find(p=>p.id===id)||{name:'?'}).name;
const custName=id=>(db.customers.find(p=>p.id===id)||{name:'?'}).name;

// ---------- navigation ----------
let view={n:'home'};
function go(n,id){view={n,id};try{window.scrollTo(0,0)}catch(e){}render()}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});
$('#back').addEventListener('click',()=>go(view.n==='party'?'parties':'customers'));
function chrome(title,sub,back,tab){
  $('#title').innerHTML=esc(title)+(sub?`<small>${sub}</small>`:'');
  $('#back').style.display=back?'block':'none';
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===tab));
}
function render(){({home:rHome,parties:rParties,customers:rCustomers,stock:rStock,party:rParty,customer:rCustomer}[view.n]||rHome)()}

// ---------- home / balance sheet ----------
function rHome(){
  const invested=db.tx.filter(t=>t.type==='purchase').reduce((a,t)=>a+t.amount,0);
  const weOwe=db.parties.reduce((a,p)=>a+partyStats(p.id).owe,0);
  const owedUs=db.customers.reduce((a,c)=>a+custStats(c.id).due,0);
  const stockVal=db.lots.reduce((a,l)=>a+l.qty*l.rate,0);
  const net=stockVal+owedUs-weOwe;
  const exp=expiring();const expired=exp.filter(l=>expiryInfo(l.expiry).k==='bad').length;
  chrome(db.shop.name,'Balance sheet',false,'home');
  const empty=!db.parties.length&&!db.customers.length&&!db.lots.length;
  $('#app').innerHTML=`
  ${exp.length?`<button class="alert ${expired?'bad':''}" onclick="go('stock')">⚠ ${exp.length} stock item${exp.length>1?'s':''} ${expired?'expired or ':''}expiring within 6 months. Tap to see.</button>`:''}
  <div class="card"><div class="lbl">Total invested (purchases from parties)</div><div class="big">${R(invested)}</div></div>
  <div class="card"><div class="lbl">We owe parties</div><div class="big red">${R(weOwe)}</div></div>
  <div class="card"><div class="lbl">Customers owe us</div><div class="big green">${R(owedUs)}</div></div>
  <div class="card"><div class="lbl">Stock in hand (at purchase rate)</div><div class="big">${R(stockVal)}</div></div>
  <div class="card" style="background:var(--accent-soft)"><div class="lbl">Net position</div><div class="big">${R(net)}</div><div class="muted" style="font-size:12.5px">Stock + customers owe us − we owe parties</div></div>
  ${empty?`<div class="card empty">Nothing added yet. Start with <b>Parties</b> (add a party, then a purchase), or load example data to look around.<div class="btns"><button class="btn o" id="ex">Load example data</button></div></div>`:''}
  ${db.parties.some(p=>partyStats(p.id).owe!==0)?`<h3>We owe</h3><div class="card" style="padding:2px 14px">${db.parties.filter(p=>partyStats(p.id).owe!==0).sort((a,b)=>partyStats(b.id).owe-partyStats(a.id).owe).map(p=>`<button class="li" onclick="go('party','${p.id}')"><span>${esc(p.name)}</span><b class="red">${R(partyStats(p.id).owe)}</b></button>`).join('')}</div>`:''}
  ${db.customers.some(c=>custStats(c.id).due!==0)?`<h3>Owed to us</h3><div class="card" style="padding:2px 14px">${db.customers.filter(c=>custStats(c.id).due!==0).sort((a,b)=>custStats(b.id).due-custStats(a.id).due).map(c=>`<button class="li" onclick="go('customer','${c.id}')"><span>${esc(c.name)}</span><b class="green">${R(custStats(c.id).due)}</b></button>`).join('')}</div>`:''}
  <h3>Backup</h3><div class="card">
    <p class="muted" style="margin:0 0 8px;font-size:13px">Your data is only on this phone. Copy a backup now and then and keep it safe (WhatsApp it to yourself).</p>
    <div class="btns two" style="margin:0"><button class="btn o" id="bCopy">Copy backup</button><button class="btn o" id="bRest">Restore backup</button></div>
    <div id="bBox" hidden><textarea id="bTxt" style="margin-top:10px"></textarea><div class="btns"><button class="btn" id="bGo" hidden>Replace all data with this backup</button></div></div>
    <div class="btns" style="margin-bottom:0"><button class="btn danger" id="wipe">Delete all data</button></div>
  </div>`;
  const ex=$('#ex');if(ex)ex.onclick=loadExample;
  $('#bCopy').onclick=()=>{const s=JSON.stringify(db);$('#bBox').hidden=false;$('#bGo').hidden=true;$('#bTxt').value=s;
    navigator.clipboard?.writeText(s).then(()=>toast('Backup copied')).catch(()=>{$('#bTxt').select();toast('Select all and copy the text')})};
  $('#bRest').onclick=()=>{$('#bBox').hidden=false;$('#bGo').hidden=false;$('#bTxt').value='';$('#bTxt').placeholder='Paste backup text here';$('#bTxt').focus()};
  $('#bGo').onclick=()=>{try{const d=JSON.parse($('#bTxt').value);if(!d.parties||!d.tx||!d.lots)throw 0;db=d;save();render();toast('Backup restored')}catch(e){toast('That text is not a valid backup')}};
  $('#wipe').onclick=e=>{const b=e.target;if(b.dataset.c){db=EMPTY();save();render();toast('All data deleted')}else{b.dataset.c=1;b.textContent='Tap again to delete everything'}};
}
function loadExample(){
  const p1={id:uid(),name:'Ali Traders'},p2={id:uid(),name:'Care Pharma'},c1={id:uid(),name:'Khan Medical'},c2={id:uid(),name:'City Pharmacy'};
  db.parties.push(p1,p2);db.customers.push(c1,c2);
  const mk=(who,item,qty,rate,exp,paid)=>{const lot={id:uid(),item,qty,orig:qty,rate,expiry:exp,party:who,date:today()};db.lots.push(lot);db.tx.push({id:uid(),type:'purchase',who,date:today(),amount:qty*rate,paid,lines:[{lot:lot.id,item,qty,rate}],note:'EXAMPLE'})};
  const m=n=>{const d=new Date();d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,7)};
  mk(p1.id,'Panadol 500mg (box)',100,320,'',20000);mk(p1.id,'Augmentin 625 (box)',30,950,m(3),10000);mk(p2.id,'Brufen 400 (box)',60,410,m(14),24000);
  db.tx.push({id:uid(),type:'pay',who:p1.id,date:today(),amount:5000,note:'EXAMPLE'});
  const lot=db.lots[0];lot.qty-=40;db.tx.push({id:uid(),type:'sale',who:c1.id,date:today(),amount:40*360,received:6000,lines:[{item:lot.item,qty:40,price:360,from:[{lot:lot.id,qty:40,rate:lot.rate}]}],note:'EXAMPLE'});
  save();render();toast('Example data loaded. Delete it before real use.');
}

// ---------- parties ----------
function rParties(){
  const total=db.parties.reduce((a,p)=>a+partyStats(p.id).owe,0);
  chrome('Parties','Total we owe: '+R(total),false,'parties');
  $('#app').innerHTML=`<div class="card" style="padding:2px 14px">${db.parties.length?db.parties.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>{const s=partyStats(p.id);
    return`<button class="li" onclick="go('party','${p.id}')"><span>${esc(p.name)}<small>Bought ${R(s.bought)} · Paid ${R(s.paid)}</small></span><b class="${s.owe>0?'red':''}">${R(s.owe)}</b></button>`}).join(''):'<div class="empty">No parties yet. Add the wholesaler you buy from.</div>'}</div>
  <div class="btns"><button class="btn" onclick="addPerson('party')">+ Add party</button></div>`;
}
function rParty(){
  const p=db.parties.find(x=>x.id===view.id);if(!p)return go('parties');
  const s=partyStats(p.id);chrome(p.name,'We owe: '+R(s.owe),true,'parties');
  const txs=db.tx.filter(t=>t.who===p.id);
  $('#app').innerHTML=`
  <div class="card"><div class="cols"><div><div class="lbl">Bought</div><b>${R(s.bought)}</b></div><div><div class="lbl">Paid</div><b>${R(s.paid)}</b></div></div>
  <div class="lbl" style="margin-top:8px">We owe</div><div class="big ${s.owe>0?'red':''}">${R(s.owe)}</div></div>
  <div class="btns two"><button class="btn" onclick="purchaseForm('${p.id}')">+ Purchase</button><button class="btn o" onclick="payForm('pay','${p.id}')">+ Payment</button></div>
  <h3>History</h3><div class="card" style="padding:2px 14px">${txs.length?txs.map(t=>txRow(t)).join(''):'<div class="empty">No entries yet.</div>'}</div>
  <div class="btns two"><button class="btn o" onclick="renameForm('party','${p.id}')">Edit name</button><button class="btn danger" onclick="delPerson('party','${p.id}')">Delete party</button></div>`;
}

// ---------- customers ----------
function rCustomers(){
  const total=db.customers.reduce((a,c)=>a+custStats(c.id).due,0);
  chrome('Customers','Owed to us: '+R(total),false,'customers');
  $('#app').innerHTML=`<div class="card" style="padding:2px 14px">${db.customers.length?db.customers.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>{const s=custStats(c.id);
    return`<button class="li" onclick="go('customer','${c.id}')"><span>${esc(c.name)}<small>Given ${R(s.given)} · Received ${R(s.recv)}</small></span><b class="${s.due>0?'green':''}">${R(s.due)}</b></button>`}).join(''):'<div class="empty">No customers yet. Add a shop you supply.</div>'}</div>
  <div class="btns"><button class="btn" onclick="addPerson('customer')">+ Add customer</button></div>`;
}
function rCustomer(){
  const c=db.customers.find(x=>x.id===view.id);if(!c)return go('customers');
  const s=custStats(c.id);chrome(c.name,'Owes us: '+R(s.due),true,'customers');
  const txs=db.tx.filter(t=>t.who===c.id);
  $('#app').innerHTML=`
  <div class="card"><div class="cols"><div><div class="lbl">Given</div><b>${R(s.given)}</b></div><div><div class="lbl">Received</div><b>${R(s.recv)}</b></div></div>
  <div class="lbl" style="margin-top:8px">Balance owed to us</div><div class="big ${s.due>0?'green':''}">${R(s.due)}</div></div>
  <div class="btns two"><button class="btn" onclick="saleForm('${c.id}')">+ Sale</button><button class="btn o" onclick="payForm('recv','${c.id}')">+ Received</button></div>
  <h3>History</h3><div class="card" style="padding:2px 14px">${txs.length?txs.map(t=>txRow(t)).join(''):'<div class="empty">No entries yet.</div>'}</div>
  <div class="btns two"><button class="btn o" onclick="renameForm('customer','${c.id}')">Edit name</button><button class="btn danger" onclick="delPerson('customer','${c.id}')">Delete customer</button></div>`;
}
function txRow(t){
  const kind={purchase:'Purchase',pay:'Payment made',sale:'Sale',recv:'Payment received'}[t.type];
  const items=(t.lines||[]).map(l=>esc(l.item)+' ×'+l.qty).join(', ');
  const extra=t.type==='purchase'&&t.paid?` · paid ${R(t.paid)}`:t.type==='sale'&&t.received?` · received ${R(t.received)}`:'';
  return`<button class="li" onclick="txDetail('${t.id}')"><span>${kind}<small>${fdate(t.date)}${items?' · '+items:''}${extra}${t.note&&t.note!=='EXAMPLE'?' · '+esc(t.note):''}</small></span><b>${R(t.amount)}</b></button>`;
}
// sorted newest first is done where needed
const _sortTx=()=>db.tx.sort((a,b)=>b.date.localeCompare(a.date));

// ---------- people ----------
function openDlg(html){const d=$('#dlg');d.innerHTML=html;if(!d.open)d.showModal();return d}
function closeDlg(){$('#dlg').close()}
function addPerson(kind){
  openDlg(`<h2>Add ${kind}</h2><div class="form" style="margin-top:12px"><label for="pn">Name<input id="pn" autocomplete="off"></label><div class="err" id="er"></div>
  <div class="btns two"><button class="btn o" onclick="closeDlg()">Cancel</button><button class="btn" id="ok">Save</button></div></div>`);
  setTimeout(()=>$('#pn').focus(),50);
  $('#ok').onclick=()=>{const n=$('#pn').value.trim();if(!n){$('#er').textContent='Enter a name';return}
    const list=kind==='party'?db.parties:db.customers;
    if(list.some(x=>x.name.toLowerCase()===n.toLowerCase())){$('#er').textContent='This name already exists';return}
    list.push({id:uid(),name:n});save();closeDlg();render();toast('Added')};
}
function renameForm(kind,id){
  const list=kind==='party'?db.parties:db.customers;const p=list.find(x=>x.id===id);
  openDlg(`<h2>Edit name</h2><div class="form" style="margin-top:12px"><label for="pn">Name<input id="pn" value="${esc(p.name)}"></label>
  <div class="btns two"><button class="btn o" onclick="closeDlg()">Cancel</button><button class="btn" id="ok">Save</button></div></div>`);
  $('#ok').onclick=()=>{const n=$('#pn').value.trim();if(!n)return;p.name=n;save();closeDlg();render()};
}
function delPerson(kind,id){
  if(db.tx.some(t=>t.who===id)){toast('Delete this '+kind+"'s entries first");return}
  openDlg(`<h2>Delete ${kind}?</h2><p class="muted">This cannot be undone.</p><div class="btns two"><button class="btn o" onclick="closeDlg()">Cancel</button><button class="btn danger" id="ok">Delete</button></div>`);
  $('#ok').onclick=()=>{if(kind==='party')db.parties=db.parties.filter(x=>x.id!==id);else db.customers=db.customers.filter(x=>x.id!==id);save();closeDlg();go(kind==='party'?'parties':'customers')};
}

// ---------- payments ----------
function payForm(type,id){
  const isPay=type==='pay';
  openDlg(`<h2>${isPay?'Payment to '+esc(partyName(id)):'Received from '+esc(custName(id))}</h2><div class="form" style="margin-top:12px">
  <div class="cols"><label for="pa">Amount (Rs)<input id="pa" type="number" inputmode="decimal" min="0"></label><label for="pd">Date<input id="pd" type="date" value="${today()}"></label></div>
  <label for="pnote">Note (optional)<input id="pnote" placeholder="cash, bank, cheque…"></label><div class="err" id="er"></div>
  <div class="btns two"><button class="btn o" onclick="closeDlg()">Cancel</button><button class="btn" id="ok">Save</button></div></div>`);
  setTimeout(()=>$('#pa').focus(),50);
  $('#ok').onclick=()=>{const a=num($('#pa').value);if(a<=0){$('#er').textContent='Enter the amount';return}
    db.tx.push({id:uid(),type,who:id,date:$('#pd').value||today(),amount:a,note:$('#pnote').value.trim()});_sortTx();save();closeDlg();render();toast('Saved')};
}

// ---------- purchase ----------
function lineRow(kind,i){
  if(kind==='buy')return`<div class="lineBox" data-i="${i}"><label>Item<input class="l-name" list="itemNames" placeholder="e.g. Panadol 500mg (box)" autocomplete="off"></label>
    <div class="cols3"><label>Qty<input class="l-qty" type="number" inputmode="decimal" min="0"></label><label>Rate (Rs)<input class="l-rate" type="number" inputmode="decimal" min="0"></label><label>Expiry<input class="l-exp" type="month"></label></div></div>`;
  const opts=stockItems().map(s=>`<option value="${esc(s.name)}">${esc(s.name)} (${s.qty} left)</option>`).join('');
  return`<div class="lineBox" data-i="${i}"><label>Item<select class="l-name"><option value="">Select item…</option>${opts}</select></label>
    <div class="cols"><label>Qty<input class="l-qty" type="number" inputmode="decimal" min="0"></label><label>Price (Rs each)<input class="l-rate" type="number" inputmode="decimal" min="0"></label></div></div>`;
}
function linesForm(kind){
  const box=$('#lines');let n=0;
  const add=()=>{box.insertAdjacentHTML('beforeend',lineRow(kind,n++));box.querySelectorAll('input,select').forEach(e=>e.oninput=tot)};
  const tot=()=>{let t=0;box.querySelectorAll('.lineBox').forEach(r=>t+=num(r.querySelector('.l-qty').value)*num(r.querySelector('.l-rate').value));$('#tt').textContent=R(t);return t};
  add();$('#addLine').onclick=add;return tot;
}
function purchaseForm(partyId){
  openDlg(`<h2>Purchase from ${esc(partyName(partyId))}</h2><datalist id="itemNames">${[...new Set(db.lots.map(l=>l.item))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  <div class="form" style="margin-top:12px"><label for="pd">Date<input id="pd" type="date" value="${today()}"></label>
  <div id="lines" class="form"></div><button class="btn o" id="addLine">+ Add another item</button>
  <div class="tot"><span>Total</span><span id="tt">Rs 0</span></div>
  <label for="paid">Paid now (Rs, leave empty if nothing paid)<input id="paid" type="number" inputmode="decimal" min="0"></label>
  <label for="pnote">Note (optional)<input id="pnote" placeholder="bill number…"></label><div class="err" id="er"></div>
  <div class="btns two"><button class="btn o" onclick="closeDlg()">Cancel</button><button class="btn" id="ok">Save purchase</button></div></div>`);
  const tot=linesForm('buy');
  $('#ok').onclick=()=>{
    const date=$('#pd').value||today();const lines=[];const lots=[];
    for(const r of document.querySelectorAll('#lines .lineBox')){
      const name=r.querySelector('.l-name').value.trim(),qty=num(r.querySelector('.l-qty').value),rate=num(r.querySelector('.l-rate').value),exp=r.querySelector('.l-exp').value;
      if(!name&&!qty&&!rate)continue;
      if(!name||qty<=0||rate<=0){$('#er').textContent='Each item needs a name, quantity and rate';return}
      const lot={id:uid(),item:name,qty,orig:qty,rate,expiry:exp||'',party:partyId,date};lots.push(lot);lines.push({lot:lot.id,item:name,qty,rate});
    }
    if(!lines.length){$('#er').textContent='Add at least one item';return}
    const amount=lines.reduce((a,l)=>a+l.qty*l.rate,0);const paid=Math.min(num($('#paid').value),amount);
    db.lots.push(...lots);db.tx.push({id:uid(),type:'purchase',who:partyId,date,amount,paid,lines,note:$('#pnote').value.trim()});_sortTx();save();closeDlg();render();toast('Purchase saved, stock added');
  };
}

// ---------- sale ----------
function saleForm(custId){
  if(!stockItems().length){toast('No stock to sell. Add a purchase first.');return}
  openDlg(`<h2>Sale to ${esc(custName(custId))}</h2>
  <div class="form" style="margin-top:12px"><label for="pd">Date<input id="pd" type="date" value="${today()}"></label>
  <div id="lines" class="form"></div><button class="btn o" id="addLine">+ Add another item</button>
  <div class="tot"><span>Total</span><span id="tt">Rs 0</span></div>
  <label for="rec">Received now (Rs, leave empty if nothing received)<input id="rec" type="number" inputmode="decimal" min="0"></label>
  <label for="pnote">Note (optional)<input id="pnote"></label><div class="err" id="er"></div>
  <div class="btns two"><button class="btn o" onclick="closeDlg()">Cancel</button><button class="btn" id="ok">Save sale</button></div></div>`);
  linesForm('sell');
  $('#ok').onclick=()=>{
    const date=$('#pd').value||today();const lines=[];const need={};
    for(const r of document.querySelectorAll('#lines .lineBox')){
      const name=r.querySelector('.l-name').value,qty=num(r.querySelector('.l-qty').value),price=num(r.querySelector('.l-rate').value);
      if(!name&&!qty&&!price)continue;
      if(!name||qty<=0||price<=0){$('#er').textContent='Each item needs an item, quantity and price';return}
      lines.push({item:name,qty,price});const k=name.toLowerCase();need[k]=(need[k]||0)+qty;
    }
    if(!lines.length){$('#er').textContent='Add at least one item';return}
    const items=stockItems();
    for(const k in need){const it=items.find(s=>s.name.toLowerCase()===k);if(!it||it.qty<need[k]){$('#er').textContent='Not enough stock of '+(it?it.name+' (only '+it.qty+' left)':k);return}}
    // take from lots: earliest expiry first, then oldest purchase
    lines.forEach(l=>{
      let left=l.qty;l.from=[];
      const lots=db.lots.filter(x=>x.item.trim().toLowerCase()===l.item.trim().toLowerCase()&&x.qty>0)
        .sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999')||a.date.localeCompare(b.date));
      for(const lot of lots){if(left<=0)break;const take=Math.min(lot.qty,left);lot.qty-=take;left-=take;l.from.push({lot:lot.id,qty:take,rate:lot.rate})}
    });
    const amount=lines.reduce((a,l)=>a+l.qty*l.price,0);const received=Math.min(num($('#rec').value),amount);
    db.tx.push({id:uid(),type:'sale',who:custId,date,amount,received,lines,note:$('#pnote').value.trim()});_sortTx();save();closeDlg();render();toast('Sale saved, stock reduced');
  };
}

// ---------- entry detail / delete ----------
function txDetail(id){
  const t=db.tx.find(x=>x.id===id);if(!t)return;
  const who=t.type==='purchase'||t.type==='pay'?partyName(t.who):custName(t.who);
  const kind={purchase:'Purchase',pay:'Payment made',sale:'Sale',recv:'Payment received'}[t.type];
  const rows=(t.lines||[]).map(l=>`<div class="li nolink"><span>${esc(l.item)}<small>${l.qty} × ${R(l.rate||l.price)}${t.type==='purchase'&&db.lots.find(x=>x.id===l.lot)?.expiry?' · exp '+fexp(db.lots.find(x=>x.id===l.lot).expiry):''}</small></span><b>${R(l.qty*(l.rate||l.price))}</b></div>`).join('');
  openDlg(`<h2>${kind}</h2><div class="muted">${esc(who)} · ${fdate(t.date)}</div>${rows?`<div style="margin-top:8px">${rows}</div>`:''}
  <div class="tot" style="margin-top:8px"><span>Amount</span><span>${R(t.amount)}</span></div>
  ${t.type==='purchase'?`<div class="tot"><span>Paid at purchase</span><span>${R(t.paid||0)}</span></div>`:''}${t.type==='sale'?`<div class="tot"><span>Received at sale</span><span>${R(t.received||0)}</span></div>`:''}
  ${t.note&&t.note!=='EXAMPLE'?`<p class="muted">${esc(t.note)}</p>`:''}<div class="err" id="er"></div>
  <div class="btns two"><button class="btn o" onclick="closeDlg()">Close</button><button class="btn danger" id="del">Delete entry</button></div>`);
  $('#del').onclick=e=>{const b=e.target;if(!b.dataset.c){b.dataset.c=1;b.textContent='Tap again to delete';return}
    if(t.type==='purchase'){
      const bad=t.lines.some(l=>{const lot=db.lots.find(x=>x.id===l.lot);return lot&&lot.qty!==lot.orig});
      if(bad){$('#er').textContent='Some of this stock is already sold. Delete those sales first.';return}
      db.lots=db.lots.filter(l=>!t.lines.some(x=>x.lot===l.id));
    }
    if(t.type==='sale'){t.lines.forEach(l=>(l.from||[]).forEach(f=>{const lot=db.lots.find(x=>x.id===f.lot);if(lot)lot.qty+=f.qty}))}
    db.tx=db.tx.filter(x=>x.id!==id);save();closeDlg();render();toast('Deleted')};
}

// ---------- stock ----------
function rStock(){
  const items=stockItems();const val=items.reduce((a,i)=>a+i.value,0);
  chrome('Stock','Value at purchase rate: '+R(val),false,'stock');
  const exp=expiring();
  $('#app').innerHTML=`
  ${exp.length?`<h3>Expiring within 6 months</h3><div class="card" style="padding:2px 14px">${exp.map(l=>{const e=expiryInfo(l.expiry);return`<button class="li" onclick="editExpiry('${esc(l.item.replace(/'/g,"\\'"))}')"><span>${esc(l.item)}<small>Qty ${l.qty} · exp ${fexp(l.expiry)} · from ${esc(partyName(l.party))}</small></span><span class="pill ${e.k==='bad'?'bad':''}">${e.txt}</span></button>`}).join('')}</div>`:''}
  <h3>All stock</h3><div class="card" style="padding:2px 14px">${items.length?items.map(i=>{const hasExp=i.lots.some(l=>l.expiry);return`<button class="li" onclick="editExpiry('${esc(i.name.replace(/'/g,"\\'"))}')"><span>${esc(i.name)}<small>Qty ${i.qty} · ${i.lots.length>1?i.lots.length+' lots':'rate '+R(i.lots[0].rate)}${hasExp?'':' · no expiry set'}</small></span><b>${R(i.value)}</b></button>`}).join(''):'<div class="empty">No stock. It appears when you add a purchase from a party.</div>'}</div>
  <p class="muted" style="font-size:12.5px">Tap an item to set or change expiry. Items are sold earliest expiry first.</p>`;
}
function editExpiry(name){
  const lots=db.lots.filter(l=>l.item===name&&l.qty>0);if(!lots.length)return;
  openDlg(`<h2>${esc(name)}</h2><p class="muted" style="margin:2px 0 10px">Set expiry for each lot (optional). You get an alert 6 months before.</p><div class="form">
  ${lots.map(l=>`<div class="lineBox"><div class="muted">Qty ${l.qty} · rate ${R(l.rate)} · from ${esc(partyName(l.party))}, ${fdate(l.date)}</div><label>Expiry<input class="e-exp" type="month" data-id="${l.id}" value="${l.expiry||''}"></label></div>`).join('')}
  <div class="btns two"><button class="btn o" onclick="closeDlg()">Cancel</button><button class="btn" id="ok">Save</button></div></div>`);
  $('#ok').onclick=()=>{document.querySelectorAll('.e-exp').forEach(i=>{const l=db.lots.find(x=>x.id===i.dataset.id);if(l)l.expiry=i.value||''});save();closeDlg();render();toast('Saved')};
}

render();
</script>
